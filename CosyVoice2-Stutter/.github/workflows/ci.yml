name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q cosyvoice tools recipes examples scripts tests third_party/Matcha-TTS/matcha
      - name: Data logic and prompt exclusion
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: find recipes/cosyvoice2 -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check publishable contents
        run: python scripts/check_release.py
